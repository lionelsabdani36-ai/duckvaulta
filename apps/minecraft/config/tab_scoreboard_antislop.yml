# Cycraft SMP Anti-Slop Scoreboard and Tablist Configuration
# Designed by: Judith (Master Guru & Mentor Akademik / Kompetisi)
# Standards: Zero Em-Dash, High Signal-to-Noise Ratio, Crossplay Ergonomics

header-footer:
  enabled: true
  disable-condition: "%world%=disabledworld"
  designs:
    default:
      header:
        - ""
        - "&b&lCYCRAFT SMP &8:: &fCROSSPLAY HUB"
        - "&7Telemetri Siber & Observabilitas Runtime"
        - ""
      footer:
        - ""
        - "&7TPS: &a%server-tps% &8| &7Ping: &a%ping%&8ms &8| &7Online: &f%online%"
        - "&7Memory: &f%memory-used%&7/&8%memory-max% MB"
