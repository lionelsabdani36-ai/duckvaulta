# Duckvaulta Core Portal (https://duckvaulta.ai.id)
server {
    server_name duckvaulta.ai.id www.duckvaulta.ai.id;

    root /var/www/duckvaulta;
    index index.html;

    # Performance
    http2 on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Dedicated EdTech AI Learning Platform (Separated from Compro)
    location /edtech/ {
        alias /var/www/edtech/;
        index index.html;
        try_files $uri $uri/ /edtech/index.html;
    }

    # Main SPA application handler
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Caching
    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|js|css|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/duckvaulta.ai.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/duckvaulta.ai.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80 default_server;
    server_name duckvaulta.ai.id www.duckvaulta.ai.id _;
    return 301 https://$host$request_uri;
}
