# EdTech AI Dedicated Subdomain (https://edtech.duckvaulta.ai.id)
server {
    server_name edtech.duckvaulta.ai.id;

    root /var/www/edtech;
    index index.html;

    # Performance
    http2 on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Security Headers
    include /etc/nginx/snippets/security-headers.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Caching
    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|js|css|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/edtech.duckvaulta.ai.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edtech.duckvaulta.ai.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name edtech.duckvaulta.ai.id;
    return 301 https://$host$request_uri;
}
