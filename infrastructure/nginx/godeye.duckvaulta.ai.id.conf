# God's Eye View 3D Geospatial Intelligence (https://godeye.duckvaulta.ai.id)
server {
    server_name godeye.duckvaulta.ai.id;

    # Enable HTTP/2 for modern high-performance TLS
    http2 on;

    # Include HSTS and security headers
    include /etc/nginx/snippets/security-headers.conf;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/godeye.duckvaulta.ai.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/godeye.duckvaulta.ai.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name godeye.duckvaulta.ai.id;
    return 301 https://$host$request_uri;
}
